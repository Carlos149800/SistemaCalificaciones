name: Pruebas automaticas del sistema de calificaciones

on:
  push:
  pull_request:

jobs:
  verificar-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar sintaxis de Python
        run: python -m compileall -q main.py calificaciones.py tests

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -p 'test_*.py' -v
